<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños Greysi!</title>
    <style>
        :root {
            --yellow: #FCD116; /* Amarillo Charlie Brown */
            --black: #1A1A1A;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: var(--yellow);
            color: var(--black);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Contenedor para el fondo de estrellas */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background-color: white;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            opacity: 0;
            animation: twinkle 3s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 0.8; transform: scale(1.2); }
        }

        .card {
            background: var(--white);
            padding: 30px;
            border-radius: 20px;
            border: 4px solid var(--black);
            box-shadow: 8px 8px 0px var(--black);
            max-width: 450px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* Línea icónica de la playera de Charlie Brown */
        .zig-zag {
            height: 20px;
            background: linear-gradient(135px, transparent 25%, var(--black) 25%, var(--black) 50%, transparent 50%, transparent 75%, var(--black) 75%), 
                        linear-gradient(225px, transparent 25%, var(--black) 25%, var(--black) 50%, transparent 50%, transparent 75%, var(--black) 75%);
            background-size: 20px 40px;
            background-position: 0 0, 0 0;
            margin: 20px 0;
        }

        h1 {
            font-size: 2.3rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
        }

        /* Estilo especial para tu frase personalizada */
        .frase-especial {
            font-style: italic;
            font-weight: bold;
            font-size: 1.3rem;
            color: #D32F2F; /* Tono rojo */
            margin: 20px 0;
            padding: 10px;
            border-left: 4px solid var(--black);
            border-right: 4px solid var(--black);
            background-color: #FFFDE7;
        }

        /* Estilo para la firma de Anibal */
        .firma {
            font-size: 1.1rem;
            font-weight: bold;
            color: #333;
            margin-top: 15px;
            text-align: right;
            font-family: 'Courier New', Courier, monospace;
        }

        .btn {
            background-color: var(--yellow);
            color: var(--black);
            border: 3px solid var(--black);
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--black);
            transition: transform 0.1s, box-shadow 0.1s;
            margin-top: 20px;
            text-transform: uppercase;
        }

        .btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--black);
        }

        /* Animación de confeti */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: var(--yellow);
            animation: drop 3s infinite linear;
            top: -20px;
            z-index: 10;
        }

        @keyframes drop {
            0% { top: -20px; transform: translateX(0) rotate(0deg); }
            100% { top: 100vh; transform: translateX(50px) rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Contenedor del fondo estrellado -->
    <div class="stars-container" id="starsBg"></div>

    <div class="card">
        <h1>¡Feliz Cumpleaños Greysi!</h1>
        
        <div class="zig-zag"></div>
